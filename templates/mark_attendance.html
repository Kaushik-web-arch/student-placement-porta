{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow border-0 rounded-4">

        <div class="card-header bg-primary text-white">

            <h3>
                Mark Attendance
            </h3>

            <h5>
                {{ company.company_name }}
            </h5>

            <small>
                Drive Date :
                {{ company.drive_date }}
            </small>

        </div>

        <div class="card-body">

            <form method="POST">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>USN</th>

                            <th>Name</th>

                            <th>Branch</th>

                            <th style="width:250px;">
                                Attendance
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                    {% for student in students %}

                    <tr>

                        <td>

                            {{ student.usn }}

                        </td>

                        <td>

                            {{ student.name }}

                        </td>

                        <td>

                            {{ student.branch }}

                        </td>

                        <td>

                            <div class="form-check form-check-inline">

                                <input
                                class="form-check-input"
                                type="radio"
                                name="{{ student.id }}"
                                value="Attended"
                                required>

                                <label class="form-check-label">

                                    Attended

                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input
                                class="form-check-input"
                                type="radio"
                                name="{{ student.id }}"
                                value="Missed">

                                <label class="form-check-label">

                                    Missed

                                </label>

                            </div>

                        </td>

                    </tr>

                    {% endfor %}

                    </tbody>

                </table>

                <button
                class="btn btn-success">

                    Save Attendance

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
