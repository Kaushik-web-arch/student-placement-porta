{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">
            <h3>Add Company</h3>
        </div>

        <div class="card-body">

                <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Company Name
            </label>

            <input
                type="text"
                class="form-control"
                name="company_name"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Placement Drive Date
            </label>

            <input
                type="date"
                class="form-control"
                name="drive_date"
                required>

        </div>

        <button class="btn btn-primary btn-lg">

            Save Company

        </button>

        </form>

        </div>

    </div>

</div>

{% endblock %}
